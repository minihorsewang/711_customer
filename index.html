<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="appTitle">Tạo Đơn Nhanh</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <div class="auth-brand">
        <span class="brand-icon">📦</span>
        <span data-i18n="appTitle">Tạo Đơn Nhanh</span>
      </div>
      <div class="lang-switch auth-lang-switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="vi">VI</button>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-authtab="login" data-i18n="authLoginTab">登入</button>
        <button class="auth-tab-btn" data-authtab="register" data-i18n="authRegisterTab">註冊</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active">
        <div class="field">
          <label data-i18n="authEmail">Email</label>
          <input type="email" id="login_email" data-i18n-ph="authEmailPh" required>
        </div>
        <div class="field">
          <label data-i18n="authPassword">密碼</label>
          <input type="password" id="login_password" data-i18n-ph="authPasswordPh" required>
        </div>
        <span class="err" id="loginErr"></span>
        <button type="submit" class="btn-primary auth-submit" data-i18n="authLoginBtn">登入</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form">
        <div class="field">
          <label data-i18n="authShopName">店家／賣場名稱</label>
          <input type="text" id="reg_shop" data-i18n-ph="authShopNamePh" required>
        </div>
        <div class="field">
          <label data-i18n="authEmail">Email</label>
          <input type="email" id="reg_email" data-i18n-ph="authEmailPh" required>
        </div>
        <div class="field">
          <label data-i18n="authPassword">密碼</label>
          <input type="password" id="reg_password" data-i18n-ph="authPasswordPhNew" required>
        </div>
        <div class="field">
          <label data-i18n="authPasswordConfirm">確認密碼</label>
          <input type="password" id="reg_password2" data-i18n-ph="authPasswordPh" required>
        </div>
        <span class="err" id="registerErr"></span>
        <button type="submit" class="btn-primary auth-submit" data-i18n="authRegisterBtn">建立帳號</button>
      </form>

      <button type="button" class="btn-secondary auth-guest-btn" id="guestBtn" data-i18n="authGuestBtn">略過登入，直接預覽畫面</button>

      <p class="auth-demo-hint" data-i18n="authDemoHint">登入帳號後，資料會安全儲存在 Supabase 雲端；訪客預覽仍只存於本機。</p>
    </div>
  </div>

<div id="app" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📦</span>
      <span class="brand-name" data-i18n="appTitle">Tạo Đơn Nhanh</span>
    </div>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn-logout" id="logoutBtn" data-i18n="authLogout">登出</button>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="vi">VI</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="create" data-i18n="tabCreate">建立訂單</button>
    <button class="tab-btn" data-tab="orders" data-i18n="tabOrders">訂單列表</button>
    <button class="tab-btn" data-tab="customers" data-i18n="tabCustomers">客戶管理</button>
    <button class="tab-btn" data-tab="blacklist" data-i18n="tabBlacklist">棄單查詢</button>
  </nav>

  <main class="content">

    <!-- ============ CREATE ORDER ============ -->
    <section id="panel-create" class="panel active">
      <div class="card">
        <h2 data-i18n="formTitle">建立 7-ELEVEN 交貨便訂單</h2>

        <div class="quick-customers" id="quickCustomers"></div>

        <form id="orderForm" novalidate>
          <div class="field">
            <label data-i18n="fieldName">收件人姓名</label>
            <input type="text" id="f_name" maxlength="10" data-i18n-ph="phName">
            <span class="err" id="err_name"></span>
          </div>

          <div class="field">
            <label data-i18n="fieldPhone">收件人手機</label>
            <input type="text" id="f_phone" maxlength="10" data-i18n-ph="phPhone">
            <span class="err" id="err_phone"></span>
          </div>

          <div class="field">
            <label data-i18n="fieldStore">7-11 收件門市</label>
            <div class="store-picker">
              <input type="text" id="f_store" maxlength="6" data-i18n-ph="phStore" autocomplete="off">
              <button type="button" class="btn-secondary btn-map" id="openStorePicker">
                <span>🗺️</span> <span data-i18n="btnPickOnMap">在地圖上選擇</span>
              </button>
            </div>
            <div class="store-confirm" id="storeConfirm" style="display:none;"></div>
            <span class="err" id="err_store"></span>
          </div>

          <div class="field">
            <label data-i18n="fieldProduct">商品內容</label>
            <input type="text" id="f_product" maxlength="40" data-i18n-ph="phProduct">
            <span class="err" id="err_product"></span>
          </div>

          <div class="row2">
            <div class="field">
              <label data-i18n="fieldAmount">代收金額 (NT$)</label>
              <input type="number" id="f_amount" min="0" data-i18n-ph="phAmount">
              <span class="err" id="err_amount"></span>
            </div>
            <div class="field">
              <label data-i18n="fieldShip">運費 (NT$)</label>
              <input type="number" id="f_ship" min="0" value="0">
            </div>
          </div>

          <div class="field">
            <label data-i18n="fieldNote">備註</label>
            <input type="text" id="f_note" maxlength="60" data-i18n-ph="phNote">
          </div>

          <div class="blacklist-check" id="blacklistHint" style="display:none;"></div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="saveCustomerBtn" data-i18n="btnSaveCustomer">儲存為常用客戶</button>
            <button type="submit" class="btn-primary" data-i18n="btnCreate">建立訂單</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ============ ORDERS LIST ============ -->
    <section id="panel-orders" class="panel">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="ordersTitle">訂單列表</h2>
          <div class="card-actions">
            <button class="btn-secondary" id="selectAllBtn" data-i18n="btnSelectAll">全選</button>
            <button class="btn-secondary" id="exportCsvBtn" data-i18n="btnExportCsv">匯出 CSV</button>
            <button class="btn-primary" id="exportXlsxBtn" data-i18n="btnExportXlsx">匯出 Excel (.xlsx)</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th></th>
                <th data-i18n="colName">姓名</th>
                <th data-i18n="colPhone">電話</th>
                <th data-i18n="colStore">店號</th>
                <th data-i18n="colProduct">商品</th>
                <th data-i18n="colAmount">代收金額</th>
                <th data-i18n="colShip">運費</th>
                <th data-i18n="colTotal">總計</th>
                <th data-i18n="colAction">操作</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
          <p class="empty-hint" id="ordersEmptyHint" data-i18n="ordersEmpty">尚無訂單</p>
        </div>
      </div>
    </section>

    <!-- ============ CUSTOMERS ============ -->
    <section id="panel-customers" class="panel">
      <div class="card">
        <h2 data-i18n="customersTitle">常用客戶管理</h2>
        <div class="table-wrap">
          <table id="customersTable">
            <thead>
              <tr>
                <th data-i18n="colName">姓名</th>
                <th data-i18n="colPhone">電話</th>
                <th data-i18n="colStore">店號</th>
                <th data-i18n="colAction">操作</th>
              </tr>
            </thead>
            <tbody id="customersBody"></tbody>
          </table>
          <p class="empty-hint" id="customersEmptyHint" data-i18n="customersEmpty">尚無常用客戶</p>
        </div>
      </div>
    </section>

    <!-- ============ BLACKLIST ============ -->
    <section id="panel-blacklist" class="panel">
      <div class="card">
        <h2 data-i18n="blacklistTitle">社群棄單查詢</h2>
        <p class="hint-text" data-i18n="blacklistDesc">輸入買家電話，查詢社群回報的棄單／拒收紀錄（僅供參考，非官方資料）。</p>
        <div class="field inline">
          <input type="text" id="blSearch" data-i18n-ph="phPhone">
          <button class="btn-primary" id="blSearchBtn" data-i18n="btnSearch">查詢</button>
        </div>
        <div id="blResult" class="bl-result"></div>

        <hr class="divider">

        <h3 data-i18n="blacklistReportTitle">回報棄單紀錄</h3>
        <div class="row2">
          <div class="field">
            <label data-i18n="fieldPhone">買家電話</label>
            <input type="text" id="blr_phone" data-i18n-ph="phPhone">
          </div>
          <div class="field">
            <label data-i18n="fieldNote">備註</label>
            <input type="text" id="blr_note" data-i18n-ph="phNote">
          </div>
        </div>
        <button class="btn-secondary" id="blReportBtn" data-i18n="btnReport">送出回報</button>

        <div class="table-wrap" style="margin-top:20px;">
          <table id="blacklistTable">
            <thead>
              <tr>
                <th data-i18n="colPhone">電話</th>
                <th data-i18n="colReports">回報次數</th>
                <th data-i18n="fieldNote">備註</th>
              </tr>
            </thead>
            <tbody id="blacklistBody"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <div id="toast" class="toast"></div>

  <!-- ============ STORE PICKER MODAL ============ -->
  <div id="storeModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="storeModalTitle">選擇 7-ELEVEN 門市</h3>
        <button type="button" class="modal-close" id="closeStorePicker">✕</button>
      </div>

      <div class="modal-body">
        <div class="store-search-row">
          <select id="storeCitySelect"></select>
          <input type="text" id="storeKeyword" data-i18n-ph="phStoreKeyword">
        </div>

        <div class="store-results" id="storeResults"></div>
        <p class="empty-hint" id="storeResultsEmpty" data-i18n="storeResultsEmpty">請選擇縣市或輸入關鍵字查詢</p>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="stores.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
